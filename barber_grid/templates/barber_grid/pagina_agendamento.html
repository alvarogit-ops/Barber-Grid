{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <title>Serviços | Barber Grid</title>
</head>
<body class="bg-body text-body">
    <div class="imagens_invisiveis">
   <img class="imagem_logotipo_escuro" src="{% static 'images/logo_tema_escuro.png' %}">
   <img class="imagem_logotipo_claro" src="{% static 'images/logo_tema_claro.png' %}">
 </div>



  <!--navbar próprio do bootstrap e material design bootstrap-->
  <nav class="text-center">
  <img id="imagem_logotipo" src="{% static 'images/logo_tema_escuro.png' %}">
     <a class="navbar-brand" href="#">Barber Grid</a>
 </nav>
        <div class="container">
            <h4>Selecione um serviço</h4>
            <hr>
                   <h5>Serviços</h5>
            <div class="card w-100">
                <div class="card-body text-center">
                  <h5 class="card-title">Card title</h5>
                  <div class="d-flex flex-row">
                    <img class="servico_img" src="{% static 'images/haircut.jpg'%}">
                  </div>
                  <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
                  <a href="#" class="btn btn-primary">Button</a>
                  </div>
            </div>
            <div class="card w-100">
                <div class="card-body text-center">
                    <div class="d-flex flex-row">
                          <img class="servico_img" src="{% static 'images/beard.jpg'%}">
                    </div>
                  <h5 class="card-title">Card title</h5>
                  <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
                  <a href="#" class="btn btn-primary">Button</a>
                  </div>
            </div>
        </div>
<script>
    const temaEscuro = window.matchMedia('(prefers-color-scheme: dark)');
        function aplicarTema(escuro) {
          document.documentElement.setAttribute(
               "data-bs-theme",
              escuro ? "dark": "light",
            );
        }

        

        

        aplicarTema(temaEscuro.matches);

        temaEscuro.addEventListener("change", (evento) => {
            aplicarTema(evento.matches);
        });


        
</script>
</body>
</html>
